# Local PostgreSQL for development and tests (production uses a hosted PostgreSQL, e.g. Neon on Vercel).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: raporton
      POSTGRES_PASSWORD: raporton
      POSTGRES_DB: raporton_next_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
volumes:
  pgdata:
